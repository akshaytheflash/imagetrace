[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edittrace"
version = "0.1.0"
description = "Forensic localization, ordering and provenance analysis of image edits"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "scipy>=1.10",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
edittrace = "edittrace.cli:main"

[tool.setuptools.packages.find]
include = ["edittrace*"]

[tool.setuptools.package-data]
edittrace = ["weights/*"]
